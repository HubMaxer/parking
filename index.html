<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkování</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
        }

        img.visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <img id="meme" src="meme.jpg" alt="Meme">
    <audio id="memeSound" src="meme.mp3" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('meme');
            const sound = document.getElementById('memeSound');

            setTimeout(() => {
                img.classList.add('visible');
            }, 100);

            sound.play().catch(() => {
                document.body.addEventListener('click', () => {
                    sound.play();
                });
            });
        });
    </script>

</body>
</html>
